<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Fit Coach — Вход</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="onb">
    <div class="onb-card" style="max-width: 460px;">
      <div class="logo onb-logo">
        <img class="logo-mark" src="assets/logo.png" alt="AI Fit Coach">
        <div class="logo-text"><span class="ai">AI</span> FIT COACH</div>
      </div>
      <p class="onb-sub" id="auth-title">Вход в аккаунт</p>

      <div style="display:flex;flex-direction:column;gap:16px;text-align:left;">
        <div class="field" id="name-field" hidden>
          <label>Имя</label>
          <input class="input" id="a-name" placeholder="Например: Максим">
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" id="a-email" type="email" placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>Пароль</label>
          <input class="input" id="a-password" type="password" placeholder="минимум 6 символов" autocomplete="current-password">
        </div>
      </div>

      <p id="auth-msg" class="msg" style="min-height:20px;margin:16px 0 0;"></p>

      <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px;">
        <button class="btn" id="a-submit">Войти</button>
        <button class="btn btn-ghost" id="a-switch">Нет аккаунта? Регистрация</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
