services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m backend.main
    env_file: .env
    volumes:
      - ./data:/app/data          # SQLite-файл живёт тут
    ports:
      - "8000:8000"               # FastAPI
    restart: unless-stopped

# Фронт (frontend/www) — это статика, которая упаковывается в APK через Capacitor
# и/или раздаётся отдельным веб-сервером. В этот compose он не входит.
