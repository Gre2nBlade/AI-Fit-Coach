<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fit Coach — MiniApp (черновик)</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>AI Fit Coach</h1>
  <p class="note">Черновой MiniApp. Дизайна нет — только кнопки и вывод JSON.</p>

  <!-- Профиль -->
  <section>
    <h2>Профиль</h2>
    <button id="btn-me">Загрузить профиль (/api/user/me)</button>
    <pre id="out-me"></pre>
  </section>

  <!-- Тренировки -->
  <section>
    <h2>Тренировки</h2>
    <button id="btn-plans">Мои планы (/api/workout/plans)</button>
    <button id="btn-generate">Сгенерировать план (/api/workout/generate)</button>
    <pre id="out-workout"></pre>
  </section>

  <!-- Питание -->
  <section>
    <h2>Питание</h2>
    <button id="btn-diary">Дневник (/api/nutrition/diary)</button>
    <pre id="out-nutrition"></pre>
  </section>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
